  <path d="M17 26C17 17.716 23.716 11 32 11C40.284 11 47 17.716 47 26" stroke="url(#gold-grad)" stroke-width="3" stroke-linecap="round" />

  <!-- Interlocking Tree of Heritage Branches -->

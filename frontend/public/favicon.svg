  <!-- Crown Heritage Diamond Seed -->
  <polygon points="32,15 36,20 32,25 28,20" fill="url(#gold-grad)" />

  <!-- Generational Nodes -->
  <circle cx="21" cy="27" r="3.25" fill="#14B8A6" />
  <circle cx="43" cy="27" r="3.25" fill="#14B8A6" />

  <!-- Foundation Root Keystone -->
  <path d="M23 48C26.5 45.5 29.5 45 32 45C34.5 45 37.5 45.5 41 48" stroke="url(#gold-grad)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="45" r="2.5" fill="url(#gold-grad)" />

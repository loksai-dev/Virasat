    <radialGradient id="center-glow" cx="32" cy="28" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#14B8A6" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#0B1F3A" stopOpacity="0" />

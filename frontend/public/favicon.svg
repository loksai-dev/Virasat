<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shield-grad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B1F3A" />
      <stop offset="50%" stopColor="#133663" />
      <stop offset="100%" stopColor="#08182E" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#F59E0B" />

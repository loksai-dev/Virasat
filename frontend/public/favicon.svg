  <!-- Protective Octagonal-Curved Shield Foundation -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0B1F3A" stroke="url(#gold-grad)" stroke-width="2.5" />
  <rect x="5" y="5" width="54" height="54" rx="14" fill="url(#center-glow)" />


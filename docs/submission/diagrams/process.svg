    <text x="646" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B1F3A">Institution-Ready Dossiers</text>
    <text x="646" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• SBI, HDFC, Zerodha, LIC, EPF</text>
    <text x="646" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Automated Annexure-A forms</text>
    <text x="646" y="116" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Indemnity bond &amp; NOC PDF generation</text>
    <rect x="646" y="146" width="218" height="32" rx="6" fill="#CCFBF1"/>
    <text x="654" y="166" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#0D9488">1-Click Transmission Ready</text>


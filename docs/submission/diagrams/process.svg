    <!-- Connector 1 -> 2 -->
    <path d="M 250,90 L 300,90" fill="none" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Box 2: Intake Agent -->
    <rect x="310" y="0" width="250" height="180" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="250" height="34" rx="10" fill="#0F766E" transform="translate(310,0)"/>
    <text x="326" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">2. INTAKE &amp; PII SCRUBBING</text>
    <text x="326" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B1F3A">Document AI &amp; Cloud DLP</text>

    <rect x="0" y="0" width="230" height="34" rx="10" fill="#1E3A8A" transform="translate(930,0)"/>
    <text x="946" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">8. APPROVAL &amp; AUDIT</text>
    <text x="946" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B1F3A">Consensus &amp; Evidence</text>
    <text x="946" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Family digital consensus e-sign</text>
    <text x="946" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Simulated institution APIs</text>
    <text x="946" y="116" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• SHA-256 chained audit ledger</text>
    <rect x="946" y="146" width="198" height="32" rx="6" fill="#DBEAFE"/>
    <text x="954" y="166" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#1E40AF">Sec 65B Certificate</text>

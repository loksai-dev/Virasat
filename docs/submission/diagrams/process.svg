    <text x="336" y="58" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0B1F3A">Anomaly &amp; Contradiction Guard</text>
    <text x="336" y="80" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Conflicting Class II claims flagged</text>
    <text x="336" y="98" font-family="-apple-system, sans-serif" font-size="11" fill="#475569">• Custodian nominee vs heir audit</text>

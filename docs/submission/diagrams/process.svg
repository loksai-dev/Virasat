  <rect x="420" y="608" width="360" height="24" rx="4" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="430" y="624" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#92400E">What-If Re-execution Loop (Dynamic Re-run without re-upload)</text>
</svg>
